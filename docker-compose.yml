services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eurowindow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eurowindow_local}
      POSTGRES_DB: ${POSTGRES_DB:-eurowindow}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - eurowindow-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eurowindow} -d ${POSTGRES_DB:-eurowindow}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eurowindow-postgres:
